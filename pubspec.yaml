name: ppb_privacy_audit
description: A personal app permission auditor for Android.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  # Local database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  # Camera (proper camera preview - as per course material)
  camera: ^0.11.0
  gal: ^2.3.0
  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  # Firestore
  cloud_firestore: ^5.6.0
  # Firebase Storage
  firebase_storage: ^12.3.4
  # Gallery picker
  image_picker: ^1.1.2
  # Utilities
  intl: ^0.19.0
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true